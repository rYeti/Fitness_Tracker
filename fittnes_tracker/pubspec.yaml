name: ForgeForm
description: "A new Flutter project."
publish_to: "none"

version: 1.0.2+11

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Flutter built-in localizations
  flutter_localizations:
    sdk: flutter

  # Internationalization package (single entry)
  intl: ^0.20.2
  table_calendar: ^3.1.2

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.0

  # API and Networking
  dio: ^5.8.0
  get_it: ^9.2.1
  logger: ^2.0.2

  fl_chart: ^1.0.0
  # Local Database
  drift: ^2.28.1

  sqlite3_flutter_libs: ^0.5.34
  sqlite3: ^2.8.0

  # Barcode Scanner
  mobile_scanner: ^7.0.1

  cupertino_icons: ^1.0.8

  flutter_speed_dial: ^7.0.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  file_picker: ^10.3.7
  csv: ^6.0.0
  flutter_svg: ^2.0.7
  audioplayers: ^6.1.0
  workmanager: ^0.9.0+3
  purchases_flutter: ^10.0.1
  url_launcher: ^6.3.1
  flutter_launcher_icons: "^0.14.4"
  flutter_native_splash: ^2.4.1
  purchases_ui_flutter: ^10.0.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  app_links: ^6.0.0
  # 4.x rather than 3.x because signalr_hub pulls sse_channel, which requires
  # uuid ^4.5.1. Only ChatRepository uses it, and `const Uuid()` / `v4()` are
  # unchanged across the major, so the bump is confined to that call.
  uuid: ^4.6.0

  # SignalR client for the Trainer Console chat. signalr_hub rather than the
  # more popular signalr_netcore: the latter imports dart:io unconditionally
  # in its WebSocket transport, so it cannot compile for web -- and web is how
  # the Trainer Console ships.
  signalr_hub: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  drift_dev: ^2.28.1
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  sqflite_common_ffi: ^2.2.0
  drift_sqflite: ^2.0.0

flutter:
  uses-material-design: true
  generate: true
  # Custom fonts for ForgeForm branding
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
    - family: Exo 2
      fonts:
        - asset: assets/fonts/Exo2-Regular.ttf
        - asset: assets/fonts/Exo2-Medium.ttf
          weight: 500
        - asset: assets/fonts/Exo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Exo2-Bold.ttf
          weight: 700
  assets:
    - assets/icon/
    - assets/icons/
    - assets/sounds/
    - assets/data/
