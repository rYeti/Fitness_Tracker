org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Windows-only workaround: Kotlin's Build Tools API incremental compiler cache
# fails to close its .tab files here (antivirus/file-indexer lock contention),
# breaking every :*:compileDebugKotlin task. Disabling incremental compilation
# avoids the failing close-cache codepath entirely.
kotlin.incremental=false
