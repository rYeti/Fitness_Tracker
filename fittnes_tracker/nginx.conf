# Flutter web is a single-page app: any path that isn't a real file in the
# bundle (a deep link, a refresh on a client-side route) must fall back to
# index.html rather than 404 — see docs/e2e-playwright.md and CLAUDE.md's
# web-support notes on this being a known host requirement.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html itself, or a redeploy can be masked by a stale
    # shell referencing old asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Flutter's default web build does NOT content-hash these — main.dart.js
    # is the same filename on every build. Long-caching it (as an earlier
    # version of this file did) means a rebuilt bundle with, say, a new
    # FORGE_API_URL never reaches a browser that already cached the old JS,
    # even across a full redeploy. Anything the build can silently overwrite
    # under the same name has to be revalidated every time.
    location ~* \.(?:js|json)$ {
        add_header Cache-Control "no-cache";
    }

    # Fonts/images are content-addressed by their own filenames in practice
    # and safe to cache aggressively.
    location ~* \.(?:css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
