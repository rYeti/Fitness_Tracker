# Flutter web is a single-page app: any path that isn't a real file in the
# bundle (a deep link, a refresh on a client-side route) must fall back to
# index.html rather than 404 — see docs/e2e-playwright.md and CLAUDE.md's
# web-support notes on this being a known host requirement.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build output; never cache index.html itself, or a
    # redeploy can be masked by a stale shell referencing old asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|json|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
