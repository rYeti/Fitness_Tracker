name: Android Release

# Publishes the Flutter app to Google Play.
#
# Deliberately NOT triggered by pushes to main: deploy.yml ships the API on
# every main push, and a store release is a different kind of event — every
# upload burns a versionCode permanently and testers see it immediately.
# Releasing is therefore an explicit act: push a version tag, or run this
# workflow by hand.
#
#   git tag v1.0.3 && git push origin v1.0.3
#
# The tag must match `version:` in pubspec.yaml (checked below), so a forgotten
# version bump fails in seconds with a clear message instead of being rejected
# by Play minutes later.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to publish to'
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      status:
        description: 'Release status on that track'
        required: true
        default: completed
        type: choice
        options: [completed, draft, inProgress]

env:
  # Tag pushes go to the internal track: instant, testers only, no review.
  # Promote from the Play Console, or run the workflow manually to pick a
  # different track. Nothing here ever auto-ships to production by default.
  DEFAULT_TRACK: internal

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fittnes_tracker

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          # pubspec "1.0.2+11" -> name 1.0.2, build number 11
          pubspec_version="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          pubspec_name="${pubspec_version%%+*}"
          tag_name="${GITHUB_REF_NAME#v}"
          echo "pubspec=$pubspec_version tag=$GITHUB_REF_NAME"
          if [ "$pubspec_name" != "$tag_name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $pubspec_name. Bump 'version:' in pubspec.yaml and re-tag."
            exit 1
          fi
          if ! printf '%s' "$pubspec_version" | grep -q '+'; then
            echo "::error::pubspec version '$pubspec_version' has no +buildNumber. Play needs a versionCode, and it must be higher than every previous upload."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # A broken build should never reach testers.
      - run: flutter test

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See docs/android-release.md."
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore_path"

          # Gradle reads this with java.util.Properties, which treats a
          # backslash as an escape and trims leading whitespace — so a password
          # containing either is silently corrupted and surfaces later as an
          # unexplained "wrong password". Escape both.
          esc() { printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/^ /\\ /'; }

          # Absolute path on purpose: app/build.gradle.kts resolves storeFile
          # with file(), which is relative to android/app — not android/ — so a
          # relative path here would silently look in the wrong directory.
          {
            echo "storePassword=$(esc "$KEYSTORE_PASSWORD")"
            echo "keyPassword=$(esc "$KEY_PASSWORD")"
            echo "keyAlias=$(esc "$KEY_ALIAS")"
            echo "storeFile=$(esc "$keystore_path")"
          } > android/key.properties

          # Fail here, with a readable error, rather than inside Gradle.
          keytool -list -keystore "$keystore_path" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "Keystore OK (alias $KEY_ALIAS)"

      - name: Build app bundle
        run: flutter build appbundle --release

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.forgeform.app
          releaseFiles: fittnes_tracker/build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || env.DEFAULT_TRACK }}
          status: ${{ inputs.status || 'completed' }}
          # The release build runs R8 (isMinifyEnabled), so without this every
          # Play Console stack trace is obfuscated.
          mappingFile: fittnes_tracker/build/app/outputs/mapping/release/mapping.txt

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-aab
          path: fittnes_tracker/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
