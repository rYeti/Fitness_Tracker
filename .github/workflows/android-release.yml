name: Android Release

# Publishes the Flutter app to Google Play.
#
# Deliberately NOT triggered by pushes to main: deploy.yml ships the API on
# every main push, and a store release is a different kind of event — every
# upload burns a versionCode permanently and testers see it immediately.
# Releasing is therefore an explicit act: push a version tag, or run this
# workflow by hand.
#
#   git tag v1.0.3 && git push origin v1.0.3
#
# The build number is NOT typed by hand. Every successful publish leaves a
# `play/<version>` tag behind, and the next run releases one above the highest
# of those — so a versionCode can never be uploaded twice, which is what
# rejected two releases in a row before this was automated. See
# docs/android-release.md, "Why the build number is CI's job".
#
# One thing must be updated before a release, checked by the preflight step
# below so a forgotten one fails in seconds rather than being rejected by Play
# minutes later: a `## Unreleased` section in both CHANGELOG.md (the
# engineering record, any length) and PLAY_NOTES.md (the short blurb published
# to Play, capped at 500 characters — Play's own per-locale limit). Publishing
# renames those headings to the version they went out as, so a release
# physically cannot reuse the previous one's notes.
#
# The version NAME still lives in fittnes_tracker/pubspec.yaml and is still
# yours to bump (1.0.2 -> 1.0.3) when a release deserves it; a v* tag has to
# match it. The `+N` in that file is written by this workflow and records what
# last published.
#
# With no PLAY_SERVICE_ACCOUNT_JSON secret the run still builds and signs the
# bundle and attaches it for manual upload, which is what a first release needs
# anyway — Play won't take API uploads until one bundle has gone through the
# Console by hand.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to publish to'
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      status:
        description: 'Release status on that track'
        required: true
        default: completed
        type: choice
        options: [completed, draft, inProgress]

# Two runs at once would compute the same build number from the same tags and
# the second upload would be rejected. Queue them instead of racing; never
# cancel, because a cancelled run may already have published.
concurrency:
  group: android-release
  cancel-in-progress: false

env:
  # Tag pushes go to the internal track: instant, testers only, no review.
  # Promote from the Play Console, or run the workflow manually to pick a
  # different track. Nothing here ever auto-ships to production by default.
  DEFAULT_TRACK: internal

  # Locale the PLAY_NOTES.md blurb is published under. Play keys release notes
  # by locale; add more files under whatsnew/ if the notes get translated.
  PLAY_LOCALE: en-US

jobs:
  release:
    runs-on: ubuntu-latest

    # The run records what it published back into the repo: a play/<version>
    # tag, and a commit stamping pubspec.yaml and both note files.
    permissions:
      contents: write

    defaults:
      run:
        working-directory: fittnes_tracker

    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is derived from the play/* tags, so this needs
          # every tag — the default shallow fetch brings none of them.
          fetch-depth: 0

      # Everything that can be checked without a toolchain is checked here, in
      # one step, so a misconfigured release fails in seconds with every
      # problem listed at once — rather than after a five-minute build, one
      # missing secret at a time.
      - name: Preflight
        id: preflight
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -uo pipefail
          failed=0
          fail() { echo "::error::$1"; failed=1; }

          # --- Version -------------------------------------------------------
          # pubspec.yaml holds the version NAME, and its `+N` records the build
          # number that last published — both read here, neither typed for this
          # release. android/app/build.gradle.kts still needs no edit: it sets
          # versionCode/versionName from flutter.versionCode/versionName, and
          # the --build-number passed to `flutter build` below feeds the first.
          pubspec_version="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          name="${pubspec_version%%+*}"
          last="${pubspec_version##*+}"
          echo "pubspec version: $pubspec_version"

          if [ "$last" = "$pubspec_version" ]; then
            fail "pubspec version '$pubspec_version' has no +buildNumber. That number records the build that last published and is the floor the next one is computed from."
            last=0
          fi

          # Every successful publish tags the commit `play/<version>`, so the
          # highest of those is the last versionCode Play has burned — the one
          # fact about Play that this repo can hold on its own. pubspec's own
          # number is the floor, which is what makes the first run after this
          # was introduced compute 11 + 1 rather than starting from zero.
          for tag in $(git tag -l 'play/*'); do
            n="${tag##*+}"
            case "$n" in ''|*[!0-9]*) continue ;; esac
            if [ "$n" -gt "$last" ]; then last="$n"; fi
          done

          build=$((last + 1))
          version="$name+$build"
          echo "Releasing $version (previous versionCode: $last)"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag_name="${GITHUB_REF_NAME#v}"
            if [ "$name" != "$tag_name" ]; then
              fail "Tag $GITHUB_REF_NAME does not match pubspec version name $name. Bump 'version:' in fittnes_tracker/pubspec.yaml and re-tag."
            fi
          fi

          # --- Release notes -------------------------------------------------
          # Two audiences, two files. Both carry a `## Unreleased` section while
          # a release is being written, and publishing renames it to the version
          # it went out as — so a release cannot silently ship the previous
          # one's notes: the section read here stops existing under that name
          # the moment it has shipped.
          #   CHANGELOG.md  the engineering record. No length limit.
          #   PLAY_NOTES.md the short blurb Play shows users. Capped at 500.
          section() {
            awk '
              $0 == "## Unreleased" { inside = 1; next }
              inside && /^## / { exit }
              inside { print }
            ' "$1" | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac
          }

          if [ -z "$(section "$GITHUB_WORKSPACE/CHANGELOG.md")" ]; then
            fail "CHANGELOG.md has no '## Unreleased' section. Write the engineering notes for this release — the previous section was renamed to its version when it published."
          fi

          notes_dir="$GITHUB_WORKSPACE/whatsnew"
          mkdir -p "$notes_dir"
          section "$GITHUB_WORKSPACE/PLAY_NOTES.md" > "$notes_dir/whatsnew-$PLAY_LOCALE"

          if [ ! -s "$notes_dir/whatsnew-$PLAY_LOCALE" ]; then
            fail "PLAY_NOTES.md has no '## Unreleased' section. Write the short user-facing blurb — it is what Play shows on the store listing, and the previous one was renamed to its version when it published."
          else
            # Play rejects release notes over 500 characters per locale.
            # Truncating would cut a sentence in half in front of real users,
            # so this is a hard stop: shorten the blurb instead.
            chars="$(LC_ALL=C.UTF-8 wc -m < "$notes_dir/whatsnew-$PLAY_LOCALE" | tr -d ' ')"
            echo "Play notes: $chars characters"
            if [ "$chars" -gt 500 ]; then
              fail "The '## Unreleased' section of PLAY_NOTES.md is $chars characters; Play allows 500 per locale. Shorten it — the long version belongs in CHANGELOG.md."
            fi
          fi

          # --- Signing secrets -----------------------------------------------
          # Reported together: finding these one run at a time is what makes a
          # first release take an afternoon. Note the names carry no ANDROID_
          # prefix — a near-miss name reads back empty, not as an error.
          for secret in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret:-}" ]; then
              fail "Repository secret $secret is not set. See docs/android-release.md."
            fi
          done

          # --- Play credentials (optional) -----------------------------------
          # Without them the run still builds and signs the bundle and attaches
          # it as an artifact to upload by hand. That isn't a fallback so much
          # as the only option for a first release: Play refuses API uploads
          # until one bundle has gone through the Console manually.
          publish=true
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            publish=false
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set — building a signed bundle but not uploading it. Download the app-release-aab artifact from this run and upload it in the Play Console."
          elif ! printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" \
                 | jq -e 'has("client_email") and has("private_key")' >/dev/null 2>&1; then
            # A JSON pasted partially, or base64-encoded by mistake, otherwise
            # surfaces as an opaque failure inside the upload action.
            fail "PLAY_SERVICE_ACCOUNT_JSON is not the service-account JSON (no client_email/private_key). Paste the whole file, unencoded."
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          {
            echo "version=$version"
            echo "build=$build"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Ready to build $version (publish to Play: $publish)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # A broken build should never reach testers.
      - run: flutter test

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore_path"

          # Gradle reads this with java.util.Properties, which treats a
          # backslash as an escape and trims leading whitespace — so a password
          # containing either is silently corrupted and surfaces later as an
          # unexplained "wrong password". Escape both.
          esc() { printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/^ /\\ /'; }

          # Absolute path on purpose: app/build.gradle.kts resolves storeFile
          # with file(), which is relative to android/app — not android/ — so a
          # relative path here would silently look in the wrong directory.
          {
            echo "storePassword=$(esc "$KEYSTORE_PASSWORD")"
            echo "keyPassword=$(esc "$KEY_PASSWORD")"
            echo "keyAlias=$(esc "$KEY_ALIAS")"
            echo "storeFile=$(esc "$keystore_path")"
          } > android/key.properties

          # Fail here, with a readable error, rather than inside Gradle.
          keytool -list -keystore "$keystore_path" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "Keystore OK (alias $KEY_ALIAS)"

      # --build-number is the computed versionCode; the version name still
      # comes from pubspec.yaml.
      - name: Build app bundle
        run: flutter build appbundle --release --build-number "${{ steps.preflight.outputs.build }}"

      - name: Publish to Google Play
        if: steps.preflight.outputs.publish == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.forgeform.app
          releaseFiles: fittnes_tracker/build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || env.DEFAULT_TRACK }}
          status: ${{ inputs.status || 'completed' }}
          # Written by the preflight step from PLAY_NOTES.md's '## Unreleased'
          # section, so the notes on Play and the notes in the repo can't drift.
          whatsNewDirectory: whatsnew
          # The release build runs R8 (isMinifyEnabled), so without this every
          # Play Console stack trace is obfuscated.
          mappingFile: fittnes_tracker/build/app/outputs/mapping/release/mapping.txt

      # A published versionCode is burned forever, so the fact that it went out
      # has to outlive the run. The tag is what the next release computes from;
      # the commit is what keeps pubspec.yaml and the notes honest about what
      # shipped, and is why an already-published section can't be written into.
      - name: Record the release
        if: steps.preflight.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
          BUILD: ${{ steps.preflight.outputs.build }}
          TARGET_BRANCH: ${{ github.ref_type == 'branch' && github.ref_name || github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The tag goes first and on its own. It is the load-bearing half: as
          # long as it lands, the next run cannot reuse this versionCode, even
          # if everything below fails.
          git tag "play/$VERSION"
          if ! git push origin "refs/tags/play/$VERSION"; then
            echo "::error::$VERSION was published to Play — the release shipped and versionCode $BUILD is burned — but the play/$VERSION tag could not be pushed. Create it by hand (git tag play/$VERSION $GITHUB_SHA && git push origin play/$VERSION), or the next release will try to upload $BUILD again and be rejected."
            exit 1
          fi

          sed -i -E "s/^version: .*/version: $VERSION/" pubspec.yaml

          # First '## Unreleased' only — every older section is already stamped.
          for f in "$GITHUB_WORKSPACE/CHANGELOG.md" "$GITHUB_WORKSPACE/PLAY_NOTES.md"; do
            awk -v stamped="## $VERSION" '
              !seen && $0 == "## Unreleased" { print stamped; seen = 1; next }
              { print }
            ' "$f" > "$f.stamped" && mv "$f.stamped" "$f"
          done

          # A half-applied stamp is worse than none: the next release would find
          # a '## Unreleased' section holding notes that have already shipped
          # and publish them again. Check the rename actually took.
          for f in "$GITHUB_WORKSPACE/CHANGELOG.md" "$GITHUB_WORKSPACE/PLAY_NOTES.md"; do
            if grep -qx '## Unreleased' "$f"; then
              echo "::error::$VERSION was published to Play — the release shipped and play/$VERSION records it — but the '## Unreleased' heading in $(basename "$f") could not be renamed. Rename it to '## $VERSION' by hand, or the next release will republish these notes."
              exit 1
            fi
          done

          git add pubspec.yaml "$GITHUB_WORKSPACE/CHANGELOG.md" "$GITHUB_WORKSPACE/PLAY_NOTES.md"
          # [skip ci]: deploy.yml ships the API on every push to main, and this
          # commit changes nothing any of the other workflows build.
          if ! git commit -m "Release $VERSION [skip ci]"; then
            echo "::error::$VERSION was published to Play — the release shipped and play/$VERSION records it — but the stamp could not be committed. On $TARGET_BRANCH, set 'version: $VERSION' in fittnes_tracker/pubspec.yaml and rename '## Unreleased' to '## $VERSION' in CHANGELOG.md and PLAY_NOTES.md."
            exit 1
          fi

          pushed=0
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              pushed=1
              break
            fi
            # The build takes ~10 minutes, so the branch may well have moved.
            # Replay the stamp on top of it rather than forcing over anyone.
            git fetch origin "$TARGET_BRANCH" || true
            git rebase "origin/$TARGET_BRANCH" || { git rebase --abort || true; break; }
            sleep $((attempt * 5))
          done

          if [ "$pushed" -ne 1 ]; then
            echo "::error::$VERSION was published to Play — the release shipped, versionCode $BUILD is burned and play/$VERSION records it. Only the repo stamp failed. On $TARGET_BRANCH: set 'version: $VERSION' in fittnes_tracker/pubspec.yaml and rename the '## Unreleased' heading to '## $VERSION' in CHANGELOG.md and PLAY_NOTES.md. Until that is done the next release will republish these same notes."
            exit 1
          fi
          echo "Stamped $VERSION on $TARGET_BRANCH and tagged play/$VERSION."

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-aab
          path: fittnes_tracker/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # A tag push that quietly builds instead of publishing would otherwise
      # look identical to one that shipped, so spell out which happened.
      - name: Summary
        if: always() && steps.preflight.outputs.version != ''
        run: |
          version="${{ steps.preflight.outputs.version }}"
          if [ "${{ steps.preflight.outputs.publish }}" = "true" ]; then
            echo "Published **$version** to the \`${{ inputs.track || env.DEFAULT_TRACK }}\` track." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Built $version — not published"
              echo
              echo "No \`PLAY_SERVICE_ACCOUNT_JSON\` secret, so nothing was uploaded to Play."
              echo "Download the **app-release-aab** artifact from this run and upload it in the"
              echo "Play Console by hand. Release notes for this version are in \`PLAY_NOTES.md\`,"
              echo "under \`## Unreleased\`."
              echo
              echo "The bundle carries versionCode \`${{ steps.preflight.outputs.build }}\`. Nothing was"
              echo "recorded in the repo, because nothing was burned — **if you do upload it by hand**,"
              echo "record it so the next release doesn't reuse the number:"
              echo
              echo '```'
              echo "git tag play/$version && git push origin play/$version"
              echo '```'
              echo
              echo "and stamp \`$version\` into \`fittnes_tracker/pubspec.yaml\` and both note headings."
              echo
              echo "See \`docs/android-release.md\` to set the service account up."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
