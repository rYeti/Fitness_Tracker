name: Flutter Web

# The Trainer Console is served from this build, so a change that breaks the
# web target breaks the trainer dashboard — not just a nice-to-have platform.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fittnes_tracker

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Errors fail the build; the repo still carries pre-existing warnings and
      # infos, so those don't. Tighten once they're cleared.
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # webcrypto compiles BoringSSL through dart:ffi, and `flutter test` runs on
      # the host VM rather than on a device — so the native library has to exist
      # in this folder before the chat encryption tests can call it. Nothing else
      # needs this: `flutter run`, the web build and `flutter test -p chrome` all
      # use the browser or the platform's own crypto. Needs cmake and a C
      # compiler, both of which ubuntu-latest already has.
      - run: flutter pub run webcrypto:setup

      - run: flutter test

      # --no-web-resources-cdn bundles CanvasKit into the output instead of
      # fetching it from gstatic.com at boot. Without it the app cannot start
      # on any machine that cannot reach Google's CDN — including the E2E job
      # below, which is how this was found.
      - run: flutter build web --release --no-web-resources-cdn

      - uses: actions/upload-artifact@v4
        with:
          name: trainer-console-web
          path: fittnes_tracker/build/web
          retention-days: 14

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: E2E against the built bundle
        working-directory: e2e
        run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

      # Deploy step intentionally omitted: the host isn't chosen yet. The
      # artifact above is a complete static bundle — point Netlify, Firebase
      # Hosting, a GCS bucket, or Cloud Run at it. Whatever host is used must
      # rewrite unknown paths to /index.html, or a refresh on a deep link 404s.
