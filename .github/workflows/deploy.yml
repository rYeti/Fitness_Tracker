name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  # Lets a config-only change (e.g. a new WEB_ORIGIN repository variable)
  # redeploy without needing a throwaway commit to main.
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west3
  REPOSITORY: fittracker-api
  SERVICE: fittracker-api
  IMAGE: europe-west3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fittracker-api/fittracker-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west3-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} ./FitTracker.Api

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        env:
          # Browser origins allowed to call the API (the Flutter web build and
          # SignalR). Repository *variables*, not secrets — they're public URLs,
          # and variables can be edited without rotating anything.
          # Settings -> Secrets and variables -> Actions -> Variables.
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
          WEB_ORIGIN_ALT: ${{ vars.WEB_ORIGIN_ALT }}
          # Firebase Cloud Messaging — the push transport for a closed app.
          # Secrets, not variables: the service account can send as this project.
          FCM_SERVICE_ACCOUNT_BASE64: ${{ secrets.FCM_SERVICE_ACCOUNT_BASE64 }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          # Cloudflare R2 — chat attachment storage. Secrets: an access key pair
          # that can write to the bucket. None of the four values below can
          # contain a comma (an account id is hex, a bucket name is DNS-safe, an
          # R2 access key id and secret access key are both plain alphanumeric),
          # which is what makes it safe to pass them the plain way rather than
          # base64'd like the FCM JSON above — that's a property of R2's
          # credential grammar, not something forgotten. See
          # docs/chat-attachments.md §A.7.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Must match the R2 bucket's own lifecycle rule (a manual dashboard
          # step, not something this workflow provisions — see
          # docs/chat-attachments.md §A.8). A variable, not a secret: it's a
          # plain number with a sane default in code (45) if unset.
          ATTACHMENT_RETENTION_DAYS: ${{ vars.ATTACHMENT_RETENTION_DAYS }}
        run: |
          set -euo pipefail

          env_vars="ConnectionStrings__DefaultConnection=${{ secrets.DATABASE_URL }},Jwt__Key=${{ secrets.JWT_KEY }},Jwt__Issuer=${{ secrets.JWT_ISSUER }},Jwt__Audience=${{ secrets.JWT_AUDIENCE }},Jwt__AccessTokenMinutes=60,Jwt__RefreshTokenDays=30,Gmail__ClientId=${{ secrets.GMAIL_CLIENT_ID }},Gmail__ClientSecret=${{ secrets.GMAIL_CLIENT_SECRET }},Gmail__RefreshToken=${{ secrets.GMAIL_REFRESH_TOKEN }},Gmail__From=${{ secrets.GMAIL_FROM }},Gmail__FromName=ForgeForm"

          # One indexed key per origin: gcloud splits --set-env-vars on commas,
          # so a comma-separated list would be parsed as separate variables.
          # Unset variables are skipped rather than passed empty, so the API
          # doesn't have to reason about blank origins.
          if [ -n "${WEB_ORIGIN:-}" ]; then
            env_vars="$env_vars,Cors__AllowedOrigins__0=$WEB_ORIGIN"
          fi
          if [ -n "${WEB_ORIGIN_ALT:-}" ]; then
            env_vars="$env_vars,Cors__AllowedOrigins__1=$WEB_ORIGIN_ALT"
          fi

          if [ -z "${WEB_ORIGIN:-}" ]; then
            echo "::warning::WEB_ORIGIN is not set — the API will fall back to any-origin without credentials, and browser SignalR will fail. See docs/cors-and-signalr.md."
          fi

          # Base64 rather than the raw JSON, and this is the reason: the line
          # above joins every setting with commas and gcloud splits on them. A
          # service-account JSON is full of commas and would be parsed as a
          # dozen malformed variables. Base64 contains none.
          if [ -n "${FCM_SERVICE_ACCOUNT_BASE64:-}" ]; then
            env_vars="$env_vars,Fcm__ServiceAccountJsonBase64=$FCM_SERVICE_ACCOUNT_BASE64"
          fi
          if [ -n "${FCM_PROJECT_ID:-}" ]; then
            env_vars="$env_vars,Fcm__ProjectId=$FCM_PROJECT_ID"
          fi

          if [ -z "${FCM_SERVICE_ACCOUNT_BASE64:-}" ]; then
            echo "::warning::FCM_SERVICE_ACCOUNT_BASE64 is not set — chat works, but nobody is notified while their app is closed. See docs/push-notifications.md."
          fi

          # Chat attachment storage. All four required together — Provider is
          # only set to r2 once the credentials are actually present, so a
          # partially-configured bucket can't half-boot into a broken state.
          if [ -n "${R2_ACCOUNT_ID:-}" ] && [ -n "${R2_BUCKET:-}" ] && [ -n "${R2_ACCESS_KEY_ID:-}" ] && [ -n "${R2_SECRET_ACCESS_KEY:-}" ]; then
            env_vars="$env_vars,Attachments__Provider=r2,Attachments__R2__AccountId=$R2_ACCOUNT_ID,Attachments__R2__Bucket=$R2_BUCKET,Attachments__R2__AccessKeyId=$R2_ACCESS_KEY_ID,Attachments__R2__SecretAccessKey=$R2_SECRET_ACCESS_KEY"
          else
            echo "::warning::R2 attachment storage is not fully configured — chat works, but the attach affordance stays disabled on every client. See docs/chat-attachments.md."
          fi

          if [ -n "${ATTACHMENT_RETENTION_DAYS:-}" ]; then
            env_vars="$env_vars,Attachments__RetentionDays=$ATTACHMENT_RETENTION_DAYS"
          fi

          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="$env_vars"
